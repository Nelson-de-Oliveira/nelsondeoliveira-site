<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesquisa — Nelson de Oliveira</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="wrap nav"><a class="brand" href="/index.html">NELSON DE OLIVEIRA</a><nav><a href="/index.html">Início</a><a href="/arquivo_vivo.html">Arquivo</a><a href="/temas.html">Temas</a><a href="/cronologia.html">Cronologia</a><a href="/evolucao.html">Evolução</a><a href="/historia.html">História</a><a href="/dialogos.html">Diálogos</a><a href="/pesquisa.html">Pesquisa</a><a href="/essenciais.html">Essenciais</a><a href="/catalogo.html">Catálogo</a><a href="/sobre.html">Sobre</a></nav></div></header><main><section class="page-head"><div class="wrap"><div class="kicker">Pesquisa</div><h1>Encontrar um texto.</h1><p>Pesquise por título, data ou palavras do texto.</p><div class="search-box"><input id="q" type="search" autocomplete="off" placeholder="Escreva uma palavra ou expressão…"><div id="meta" class="search-meta"></div></div></div></section><div class="wrap search-results" id="results"></div><script>const i=document.getElementById('q'),r=document.getElementById('results'),m=document.getElementById('meta');let d=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();fetch('/pesquisa.json').then(x=>x.json()).then(x=>{d=x;go('')});function go(q){const n=norm(q.trim()),a=n?d.filter(x=>norm([x.title,x.date,x.text].join(' ')).includes(n)):d;m.textContent=q.trim()?a.length+' resultado'+(a.length===1?'':'s'):d.length+' textos no arquivo';r.innerHTML=a.slice(0,100).map(x=>'<article class="search-result"><div class="search-result-meta">'+esc(x.date||'')+'</div><h2><a href="'+x.url+'">'+esc(x.title)+'</a></h2><p>'+esc(x.text.slice(0,240))+(x.text.length>240?'…':'')+'</p><a class="read-link" href="'+x.url+'">Ler →</a></article>').join('')||'<div class="note-box"><strong>Não encontrei resultados.</strong></div>'}i.addEventListener('input',e=>go(e.target.value));</script></main><footer><div class="wrap">Nelson de Oliveira · Pensamento · Memória · Intervenção.</div></footer><script src="/assets/site-data.js" defer></script></body></html>
