name: Verificar e preparar site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Gerar índice central
        run: python3 scripts/build_data.py
      - name: Commit dos índices gerados
        run: |
          if git diff --quiet -- data/posts.json pesquisa.json sitemap.xml; then
            echo "Índices já actualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json pesquisa.json sitemap.xml
          git commit -m "Update generated site indexes"
          git push

  check-site:
    needs: build-data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar links e estrutura
        run: python3 scripts/check_site.py
